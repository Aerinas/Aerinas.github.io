baseURL = 'https://aerinas.github.io/'
title = '香梨椰奶冰糕的甜品屋'
theme = 'reimu'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-CN'
[languages]
[languages.zh-CN]
languageName = '简体中文'
weight = 1
hasCJKLanguage = true
[markup.highlight]
guessSyntax = true
noClasses = false 
[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [['\[', '\]'], ['$$', '$$']]
delimiters.inline = [['\(', '\)'], ['$', '$']]
[caches]
[caches.images]
dir = ':cacheDir/images'
